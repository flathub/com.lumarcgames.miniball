app-id: com.lumarcgames.miniball
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
base: org.godotengine.godot.BaseApp
base-version: "4.6.1"
command: miniball
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri

modules:
  - name: miniball
    buildsystem: simple
    build-commands:
      - install -Dm755 miniball.*64 /app/bin/miniball
      - install -Dm644 miniball.pck /app/bin/miniball.pck
      - install -Dm644 libwebrtc_native.linux.template_release.*.so /app/bin/
      - install -Dm644 com.lumarcgames.miniball.desktop /app/share/applications/com.lumarcgames.miniball.desktop
      - install -Dm644 com.lumarcgames.miniball.metainfo.xml /app/share/metainfo/com.lumarcgames.miniball.metainfo.xml
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/com.lumarcgames.miniball.png
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/lumarcgames/miniball-releases/releases/download/v1.1/miniball.x86_64.tar.xz
        sha256: ec88519c1f14cda6e283aa841e674a7868373f21c1eacee9ad99df59a4d33361
        strip-components: 0

      - type: archive
        only-arches: [aarch64]
        url: https://github.com/lumarcgames/miniball-releases/releases/download/v1.1/miniball.arm64.tar.xz
        sha256: d8301c1a3e5a1b888d019e44063eaec89aedf893c2b63c5fa9f81a452c9a91cb
        strip-components: 0
